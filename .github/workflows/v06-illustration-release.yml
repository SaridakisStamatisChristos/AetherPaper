name: Preserve v0.6 original illustrated character artwork
on:
  push:
    branches: [feature/illustrated-assets-v0.6]
    paths:
      - '.github/workflows/v06-illustration-release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preserve-ai-art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local rendering engine and FFmpeg
        run: |
          python -m pip install -e '.[dev]'
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Acquire and verify original illustrated six-pose PNG
        run: |
          set -euo pipefail
          mkdir -p examples/assets/ai_courier
          if [ ! -f examples/assets/ai_courier/original_pose_atlas.png ]; then
            curl --fail --location --silent --show-error --retry 3 --max-time 120 \
              'https://e750f2de-4821-48f5-92b3-32ccdc49b9dc.sandbox.floot.app/_cdn/static/9432aaf0-941e-41db-8551-675429b4166c-aetherpaper_v06_illustrated_six_pose_atlas.png' \
              --output examples/assets/ai_courier/original_pose_atlas.png
          fi
          echo '21a117aba23df6a164eb631b5a7bcc4664d19491620ab2ae752da3af053d340b  examples/assets/ai_courier/original_pose_atlas.png' | sha256sum --check
          aetherpaper posepack --sheet examples/assets/ai_courier/original_pose_atlas.png \
              --layout examples/assets/ai_courier/pose_layout.json \
              --out examples/assets/ai_courier/poses > illustrated_posepack_receipt.json
          aetherpaper validate examples/ai_illustrated_courier_v06.json
          aetherpaper manifest examples/ai_illustrated_courier_v06.json > illustrated_asset_manifest.json
          python -m pytest -q tests/test_ai_courier_v06.py
      - name: Render and decode original five-second character movie
        run: |
          set -euo pipefail
          mkdir -p samples/v0.6/ai
          aetherpaper render examples/ai_illustrated_courier_v06.json \
              --width 640 --height 360 --fps 12 \
              --out samples/v0.6/ai/v06_ai_illustrated_movie.mp4
          aetherpaper snapshot examples/ai_illustrated_courier_v06.json --at 0.85 \
              --out samples/v0.6/ai/v06_ai_walk.png --width 640 --height 360
          aetherpaper snapshot examples/ai_illustrated_courier_v06.json --at 2.45 \
              --out samples/v0.6/ai/v06_ai_reach.png --width 640 --height 360
          aetherpaper snapshot examples/ai_illustrated_courier_v06.json --at 3.45 \
              --out samples/v0.6/ai/v06_ai_carry.png --width 640 --height 360
          aetherpaper snapshot examples/ai_illustrated_courier_v06.json --at 4.55 \
              --out samples/v0.6/ai/v06_ai_speak.png --width 640 --height 360
          aetherpaper qa samples/v0.6/ai/v06_ai_illustrated_movie.mp4 --frames-dir illustrated_qa > samples/v0.6/ai/v06_ai_quality.json
          ffprobe -v error -select_streams v:0 \
              -show_entries stream=codec_name,width,height,r_frame_rate,nb_frames \
              -of default=noprint_wrappers=1 samples/v0.6/ai/v06_ai_illustrated_movie.mp4
      - name: Commit original PNG and validated movie to the feature branch
        run: |
          set -euo pipefail
          git fetch origin feature/illustrated-assets-v0.6
          if [ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]; then
            echo 'Newer source exists: refusing a stale publish.'
            exit 1
          fi
          cp illustrated_asset_manifest.json samples/v0.6/ai/v06_ai_asset_manifest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f examples/assets/ai_courier/original_pose_atlas.png
          git add -f examples/assets/ai_courier/poses/*.png
          git add -f examples/assets/ai_courier/poses/posepack.json
          git add -f samples/v0.6/ai/
          if ! git diff --cached --quiet; then
            git commit -m 'chore(v0.6): preserve actual illustrated AI pose assets and verified 5s video [skip ci]'
            git push origin HEAD:feature/illustrated-assets-v0.6
          fi
      - name: Archive original artwork and movie for download
        uses: actions/upload-artifact@v4
        with:
          name: v06-original-ai-character-and-movie
          path: |
            examples/assets/ai_courier/
            samples/v0.6/ai/
          retention-days: 30
