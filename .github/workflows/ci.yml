name: Engine tests and render smoke test
on:
  push:
    branches: [main, feature/**]
  pull_request:
concurrency:
  group: aetherpaper-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng
      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Unit and integration tests
        run: pytest -q
      - name: Validate supplied animation scenes
        run: |
          aetherpaper validate examples/room_pickup.json
          aetherpaper validate examples/three_scenes.json
          aetherpaper validate examples/rig_demo.json
          aetherpaper validate examples/interaction_demo.json
          aetherpaper validate examples/visual_demo.json
          aetherpaper validate examples/explainer_demo.json
          aetherpaper validate examples/physics_demo.json
          aetherpaper manifest examples/explainer_demo.json > output-manifest.json
      - name: Render actual short movie
        run: aetherpaper render examples/room_pickup.json --width 320 --height 180 --fps 6 --out output/ci.mp4
      - name: Render articulated JSON demonstration
        run: |
          aetherpaper render examples/rig_demo.json --width 320 --height 180 --fps 12 --out output/rig_demo.mp4
          aetherpaper snapshot examples/rig_demo.json --at 1.2 --out output/rig_run.png
          aetherpaper snapshot examples/rig_demo.json --at 3.5 --out output/rig_gesture.png
          aetherpaper snapshot examples/rig_demo.json --at 6.0 --out output/rig_speech.png
      - name: Render genuine pickup and placement demonstration
        run: |
          aetherpaper render examples/interaction_demo.json --width 320 --height 180 --fps 12 --out output/interaction_demo.mp4
          aetherpaper snapshot examples/interaction_demo.json --at 3.0 --out output/prop_pickup.png
          aetherpaper snapshot examples/interaction_demo.json --at 6.0 --out output/prop_carry.png
          aetherpaper snapshot examples/interaction_demo.json --at 9.0 --out output/prop_placed.png
      - name: Render all three visual styles
        run: |
          aetherpaper render examples/visual_demo.json --width 320 --height 180 --fps 12 --out output/visual_demo.mp4
          aetherpaper snapshot examples/visual_demo.json --at 1.5 --out output/style_papercut.png
          aetherpaper snapshot examples/visual_demo.json --at 4.5 --out output/style_scrapbook.png
          aetherpaper snapshot examples/visual_demo.json --at 7.5 --out output/style_storybook.png
      - name: Render and audit 24-second narrated explainer
        run: |
          aetherpaper render examples/explainer_demo.json --voice espeak --width 320 --height 180 --fps 12 --out output/explainer_demo.mp4
          aetherpaper qa output/explainer_demo.mp4 --frames-dir output/qa > output/explainer_qa.json
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=noprint_wrappers=1 output/explainer_demo.mp4 | grep -q 'codec_name=aac'
      - name: Render physics demonstration
        run: |
          aetherpaper render examples/physics_demo.json --width 320 --height 180 --fps 12 --out output/physics_demo.mp4
          aetherpaper qa output/physics_demo.mp4 --frames-dir output/physics_qa > output/physics_qa.json
      - name: Render 10-second cinematic visual-quality acceptance scene
        run: |
          aetherpaper validate examples/lantern_keeper_v03.json
          aetherpaper render examples/lantern_keeper_v03.json --width 640 --height 360 --fps 24 --out output/lantern_keeper_v03.mp4
          aetherpaper snapshot examples/lantern_keeper_v03.json --at 1.3 --out output/lantern_approach.png --width 960 --height 540
          aetherpaper snapshot examples/lantern_keeper_v03.json --at 3.6 --out output/lantern_reach.png --width 960 --height 540
          aetherpaper snapshot examples/lantern_keeper_v03.json --at 5.7 --out output/lantern_carry.png --width 960 --height 540
          aetherpaper snapshot examples/lantern_keeper_v03.json --at 9.2 --out output/lantern_final.png --width 960 --height 540
          aetherpaper qa output/lantern_keeper_v03.mp4 --frames-dir output/lantern_qa > output/lantern_quality.json
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate,nb_frames -of default=noprint_wrappers=1 output/lantern_keeper_v03.mp4
      - name: Generate 20 PNG parts and render v0.4 character art film
        run: |
          set -euo pipefail
          aetherpaper artkit --out examples/assets/atelier_courier > output/artkit_receipt_v04.json
          aetherpaper validate examples/last_light_v04.json
          aetherpaper manifest examples/last_light_v04.json > output/asset_manifest_v04.json
          aetherpaper render examples/last_light_v04.json --width 640 --height 360 --fps 24 --out output/last_light_v04.mp4
          aetherpaper snapshot examples/last_light_v04.json --at 1.8 --width 960 --height 540 --out output/artkit_approach.png
          aetherpaper snapshot examples/last_light_v04.json --at 3.95 --width 960 --height 540 --out output/artkit_reach.png
          aetherpaper snapshot examples/last_light_v04.json --at 6.0 --width 960 --height 540 --out output/artkit_carry.png
          aetherpaper snapshot examples/last_light_v04.json --at 9.5 --width 960 --height 540 --out output/artkit_expression.png
          aetherpaper qa output/last_light_v04.mp4 --frames-dir output/artkit_qa > output/artkit_quality_v04.json
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate,nb_frames -of default=noprint_wrappers=1 output/last_light_v04.mp4
      - name: Build studio-grade source art and render directed v0.5 film
        run: |
          set -euo pipefail
          aetherpaper artkit --edition studio --out examples/assets/studio_courier > output/studio_art_receipt_v05.json
          aetherpaper validate examples/last_light_directed_v05.json
          aetherpaper manifest examples/last_light_directed_v05.json > output/studio_manifest_v05.json
          aetherpaper render examples/last_light_directed_v05.json --width 640 --height 360 --fps 24 --out output/last_light_directed_v05.mp4
          aetherpaper snapshot examples/last_light_directed_v05.json --at 2.2 --width 960 --height 540 --out output/v05_arrival.png
          aetherpaper snapshot examples/last_light_directed_v05.json --at 4.7 --width 960 --height 540 --out output/v05_reach.png
          aetherpaper snapshot examples/last_light_directed_v05.json --at 8.4 --width 960 --height 540 --out output/v05_carry.png
          aetherpaper snapshot examples/last_light_directed_v05.json --at 12.6 --width 960 --height 540 --out output/v05_finale.png
          aetherpaper qa output/last_light_directed_v05.mp4 --frames-dir output/v05_video_qa > output/v05_quality.json
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate,nb_frames -of default=noprint_wrappers=1 output/last_light_directed_v05.mp4
      - name: Verify artist-pose atlas importer and render real v0.6 film
        run: |
          set -euo pipefail
          aetherpaper pose-demo --source examples/last_light_directed_v05.json --out examples > output/v06_pose_demo_receipt.json
          aetherpaper validate examples/pose_atlas_demo_v06.json
          aetherpaper manifest examples/pose_atlas_demo_v06.json > output/v06_manifest.json
          aetherpaper render examples/pose_atlas_demo_v06.json --width 640 --height 360 --fps 12 --out output/v06_pose_atlas_demo.mp4
          aetherpaper snapshot examples/pose_atlas_demo_v06.json --at 0.7 --out output/v06_walk.png --width 640 --height 360
          aetherpaper snapshot examples/pose_atlas_demo_v06.json --at 2.5 --out output/v06_reach.png --width 640 --height 360
          aetherpaper snapshot examples/pose_atlas_demo_v06.json --at 4.3 --out output/v06_speak.png --width 640 --height 360
          aetherpaper qa output/v06_pose_atlas_demo.mp4 --frames-dir output/v06_qa > output/v06_quality.json
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate,nb_frames -of default=noprint_wrappers=1 output/v06_pose_atlas_demo.mp4
      - name: Import the actual six-pose AI illustrated RGBA character atlas
        run: |
          set -euo pipefail
          mkdir -p examples/assets/ai_courier
          if [ ! -f examples/assets/ai_courier/original_pose_atlas.png ]; then
            curl --fail --location --silent --show-error --retry 3 --max-time 120 \
              'https://e750f2de-4821-48f5-92b3-32ccdc49b9dc.sandbox.floot.app/_cdn/static/9432aaf0-941e-41db-8551-675429b4166c-aetherpaper_v06_illustrated_six_pose_atlas.png' \
              --output examples/assets/ai_courier/original_pose_atlas.png
          fi
          echo '21a117aba23df6a164eb631b5a7bcc4664d19491620ab2ae752da3af053d340b  examples/assets/ai_courier/original_pose_atlas.png' | sha256sum --check
          aetherpaper posepack --sheet examples/assets/ai_courier/original_pose_atlas.png \
             --layout examples/assets/ai_courier/pose_layout.json \
             --out examples/assets/ai_courier/poses > output/v06_ai_posepack_receipt.json
          aetherpaper validate examples/ai_illustrated_courier_v06.json
          aetherpaper manifest examples/ai_illustrated_courier_v06.json > output/v06_ai_asset_manifest.json
          python -m pytest -q tests/test_ai_courier_v06.py
      - name: Render the five-second true illustrated character film
        run: |
          set -euo pipefail
          aetherpaper render examples/ai_illustrated_courier_v06.json --width 640 --height 360 --fps 12 \
            --out output/v06_ai_illustrated_movie.mp4
          aetherpaper snapshot examples/ai_illustrated_courier_v06.json --at 0.85 --width 640 --height 360 --out output/v06_ai_walk.png
          aetherpaper snapshot examples/ai_illustrated_courier_v06.json --at 2.45 --width 640 --height 360 --out output/v06_ai_reach.png
          aetherpaper snapshot examples/ai_illustrated_courier_v06.json --at 3.45 --width 640 --height 360 --out output/v06_ai_carry.png
          aetherpaper snapshot examples/ai_illustrated_courier_v06.json --at 4.55 --width 640 --height 360 --out output/v06_ai_speak.png
          aetherpaper qa output/v06_ai_illustrated_movie.mp4 --frames-dir output/v06_ai_qa > output/v06_ai_quality.json
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate,nb_frames -of default=noprint_wrappers=1 output/v06_ai_illustrated_movie.mp4
      - name: Probe MP4 stream
        run: |
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of default=noprint_wrappers=1 output/ci.mp4
          test -s output/ci.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate,nb_frames -of default=noprint_wrappers=1 output/rig_demo.mp4
          test -s output/rig_demo.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate,nb_frames -of default=noprint_wrappers=1 output/interaction_demo.mp4
          test -s output/interaction_demo.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate,nb_frames -of default=noprint_wrappers=1 output/visual_demo.mp4
          test -s output/visual_demo.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate,nb_frames -of default=noprint_wrappers=1 output/explainer_demo.mp4
          test -s output/explainer_demo.mp4
          test -s output/physics_demo.mp4
      - name: Upload reproducible rendered demonstrations
        uses: actions/upload-artifact@v4
        with:
          name: aetherpaper-v02-rig-render
          path: |
            output/rig_demo.mp4
            output/interaction_demo.mp4
            output/visual_demo.mp4
            output/explainer_demo.mp4
            output/physics_demo.mp4
            output/physics_qa.json
            output/physics_qa/
            output/explainer_qa.json
            output/qa/
            output-manifest.json
            output/style_papercut.png
            output/style_scrapbook.png
            output/style_storybook.png
            output/prop_pickup.png
            output/prop_carry.png
            output/prop_placed.png
            output/rig_run.png
            output/rig_gesture.png
            output/rig_speech.png
          retention-days: 30

      - name: Upload v0.3 cinematic acceptance film and storyboards
        uses: actions/upload-artifact@v4
        with:
          name: aetherpaper-v03-cinematic
          path: |
            output/lantern_keeper_v03.mp4
            output/lantern_approach.png
            output/lantern_reach.png
            output/lantern_carry.png
            output/lantern_final.png
            output/lantern_quality.json
            output/lantern_qa/
          retention-days: 30
      - name: Preserve verified v0.3 film on GitHub
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/visual-quality-v0.3'
        run: |
          set -euo pipefail
          git fetch origin feature/visual-quality-v0.3
          if [ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]; then
            echo "New source commit exists; skip publication from stale CI job."
            exit 0
          fi
          mkdir -p samples/v0.3
          cp output/lantern_keeper_v03.mp4 samples/v0.3/
          cp output/lantern_approach.png output/lantern_reach.png output/lantern_carry.png output/lantern_final.png samples/v0.3/
          cp output/lantern_quality.json samples/v0.3/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add samples/v0.3
          git add -f samples/v0.3/lantern_keeper_v03.mp4
          if ! git diff --cached --quiet; then
            git commit -m 'chore(samples): publish verified cinematic v0.3 demo [skip ci]'
            git push origin HEAD:feature/visual-quality-v0.3
          fi
      - name: Upload independently rendered v0.4 character film and original artkit
        uses: actions/upload-artifact@v4
        with:
          name: aetherpaper-v04-character-art
          path: |
            output/last_light_v04.mp4
            output/artkit_approach.png
            output/artkit_reach.png
            output/artkit_carry.png
            output/artkit_expression.png
            output/artkit_quality_v04.json
            output/artkit_receipt_v04.json
            output/asset_manifest_v04.json
            output/artkit_qa/
            examples/assets/atelier_courier/
          retention-days: 30
      - name: Permanently preserve verified v0.4 artkit and cinematic film
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/character-art-v0.4'
        run: |
          set -euo pipefail
          git fetch origin feature/character-art-v0.4
          if [ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]; then
            echo "Source branch updated during CI; do not publish stale samples."
            exit 0
          fi
          mkdir -p samples/v0.4
          cp output/last_light_v04.mp4 samples/v0.4/
          cp output/artkit_approach.png output/artkit_reach.png output/artkit_carry.png output/artkit_expression.png samples/v0.4/
          cp output/artkit_quality_v04.json output/artkit_receipt_v04.json output/asset_manifest_v04.json samples/v0.4/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Keep the 20 original source-generated transparent artworks in GitHub too.
          # They are the exact PNGs used to render the attached MP4.
          git add samples/v0.4
          git add -f examples/assets/atelier_courier/*.png
          git add -f samples/v0.4/last_light_v04.mp4
          if ! git diff --cached --quiet; then
            git commit -m 'chore(samples): preserve CI-verified v0.4 character art film [skip ci]'
            git push origin HEAD:feature/character-art-v0.4
          fi
      - name: Upload v0.5 directed film, studio art and verification
        uses: actions/upload-artifact@v4
        with:
          name: aetherpaper-v05-studio-director
          path: |
            output/last_light_directed_v05.mp4
            output/v05_arrival.png
            output/v05_reach.png
            output/v05_carry.png
            output/v05_finale.png
            output/v05_quality.json
            output/studio_manifest_v05.json
            output/studio_art_receipt_v05.json
            output/v05_video_qa/
            examples/assets/studio_courier/
          retention-days: 30
      - name: Preserve verified v0.5 production artwork and film
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/art-direction-v0.5'
        run: |
          set -euo pipefail
          git fetch origin feature/art-direction-v0.5
          if [ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]; then
            echo "Newer commit exists; avoid overwriting verified films."
            exit 0
          fi
          mkdir -p samples/v0.5
          cp output/last_light_directed_v05.mp4 samples/v0.5/
          cp output/v05_arrival.png output/v05_reach.png output/v05_carry.png output/v05_finale.png samples/v0.5/
          cp output/v05_quality.json output/studio_manifest_v05.json output/studio_art_receipt_v05.json samples/v0.5/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add samples/v0.5
          git add -f samples/v0.5/last_light_directed_v05.mp4
          git add -f examples/assets/studio_courier/*.png
          if ! git diff --cached --quiet; then
            git commit -m 'chore(samples): store tested v0.5 directed 14-second film and original character PNGs [skip ci]'
            git push origin HEAD:feature/art-direction-v0.5
          fi
      - name: Upload v0.6 whole-illustration pose atlas and real movie
        uses: actions/upload-artifact@v4
        with:
          name: aetherpaper-v06-pose-atlas
          path: |
            output/v06_pose_atlas_demo.mp4
            output/v06_walk.png
            output/v06_reach.png
            output/v06_speak.png
            output/v06_quality.json
            output/v06_manifest.json
            output/v06_pose_demo_receipt.json
            output/v06_qa/
            examples/pose_atlas_demo_v06.json
            examples/assets/pose_atlas_demo/
          retention-days: 30
      - name: Preserve v0.6 acceptance source poses and verified MP4
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/illustrated-assets-v0.6'
        run: |
          set -euo pipefail
          git fetch origin feature/illustrated-assets-v0.6
          if [ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]; then
            echo "A newer commit exists; do not publish stale acceptance footage."
            exit 0
          fi
          mkdir -p samples/v0.6
          cp output/v06_pose_atlas_demo.mp4 samples/v0.6/
          cp output/v06_walk.png output/v06_reach.png output/v06_speak.png samples/v0.6/
          cp output/v06_quality.json output/v06_manifest.json samples/v0.6/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add samples/v0.6 examples/pose_atlas_demo_v06.json examples/assets/pose_atlas_demo/demo_layout.json
          git add -f samples/v0.6/v06_pose_atlas_demo.mp4 examples/assets/pose_atlas_demo/demo_sheet.png examples/assets/pose_atlas_demo/poses/*.png examples/assets/pose_atlas_demo/poses/posepack.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(samples): archive verified v0.6 transparent pose atlas and 5-second film [skip ci]'
            git push origin HEAD:feature/illustrated-assets-v0.6
          fi
      - name: Upload actual AI illustrated film and imported pose source
        uses: actions/upload-artifact@v4
        with:
          name: aetherpaper-v06-ai-illustrated-courier
          path: |
            output/v06_ai_illustrated_movie.mp4
            output/v06_ai_walk.png
            output/v06_ai_reach.png
            output/v06_ai_carry.png
            output/v06_ai_speak.png
            output/v06_ai_quality.json
            output/v06_ai_asset_manifest.json
            output/v06_ai_posepack_receipt.json
            output/v06_ai_qa/
            examples/assets/ai_courier/
            examples/ai_illustrated_courier_v06.json
          retention-days: 30
      - name: Preserve actual transparent AI illustration and verified video in GitHub
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/illustrated-assets-v0.6'
        run: |
          set -euo pipefail
          git fetch origin feature/illustrated-assets-v0.6
          if [ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]; then
            echo "A newer commit exists; skip publication of stale frames."
            exit 0
          fi
          mkdir -p samples/v0.6/ai
          cp output/v06_ai_illustrated_movie.mp4 samples/v0.6/ai/
          cp output/v06_ai_walk.png output/v06_ai_reach.png output/v06_ai_carry.png output/v06_ai_speak.png samples/v0.6/ai/
          cp output/v06_ai_quality.json output/v06_ai_asset_manifest.json samples/v0.6/ai/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add samples/v0.6/ai examples/assets/ai_courier/pose_layout.json
          git add -f examples/assets/ai_courier/original_pose_atlas.png examples/assets/ai_courier/poses/*.png examples/assets/ai_courier/poses/posepack.json samples/v0.6/ai/v06_ai_illustrated_movie.mp4
          if ! git diff --cached --quiet; then
            git commit -m 'chore(samples): preserve actual six-pose AI character artwork and five-second acceptance film [skip ci]'
            git push origin HEAD:feature/illustrated-assets-v0.6
          fi
      - name: Archive independently verified MP4 previews in the feature branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/advanced-animation-v0.2'
        run: |
          set -euo pipefail
          if test -f samples/v0.2/explainer_demo.mp4; then
            echo "Verified samples already preserved in samples/v0.2"
            exit 0
          fi
          mkdir -p samples/v0.2
          cp output/rig_demo.mp4 output/interaction_demo.mp4 output/physics_demo.mp4 output/visual_demo.mp4 output/explainer_demo.mp4 samples/v0.2/
          cp output/rig_run.png output/rig_gesture.png output/rig_speech.png samples/v0.2/
          cp output/prop_pickup.png output/prop_carry.png output/prop_placed.png samples/v0.2/
          cp output/style_papercut.png output/style_scrapbook.png output/style_storybook.png samples/v0.2/
          cp output/explainer_qa.json output/physics_qa.json samples/v0.2/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add samples/v0.2
          # mp4 is deliberately ignored for ordinary development: only CI can force-add verified previews.
          git add -f samples/v0.2/rig_demo.mp4 samples/v0.2/interaction_demo.mp4 samples/v0.2/physics_demo.mp4 samples/v0.2/visual_demo.mp4 samples/v0.2/explainer_demo.mp4
          if ! git diff --cached --quiet; then
            git commit -m 'chore(samples): preserve CI-verified v0.2 MP4 demonstrations [skip ci]'
            git push origin HEAD:feature/advanced-animation-v0.2
          fi
