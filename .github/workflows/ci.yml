name: Engine tests and render smoke test
on:
  push:
    branches: [main, feature/**]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng
      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Unit and integration tests
        run: pytest -q
      - name: Validate supplied animation scenes
        run: |
          aetherpaper validate examples/room_pickup.json
          aetherpaper validate examples/three_scenes.json
          aetherpaper validate examples/rig_demo.json
          aetherpaper validate examples/interaction_demo.json
          aetherpaper validate examples/visual_demo.json
          aetherpaper validate examples/explainer_demo.json
          aetherpaper validate examples/physics_demo.json
          aetherpaper manifest examples/explainer_demo.json > output-manifest.json
      - name: Render actual short movie
        run: aetherpaper render examples/room_pickup.json --width 320 --height 180 --fps 6 --out output/ci.mp4
      - name: Render articulated JSON demonstration
        run: |
          aetherpaper render examples/rig_demo.json --width 320 --height 180 --fps 12 --out output/rig_demo.mp4
          aetherpaper snapshot examples/rig_demo.json --at 1.2 --out output/rig_run.png
          aetherpaper snapshot examples/rig_demo.json --at 3.5 --out output/rig_gesture.png
          aetherpaper snapshot examples/rig_demo.json --at 6.0 --out output/rig_speech.png
      - name: Render genuine pickup and placement demonstration
        run: |
          aetherpaper render examples/interaction_demo.json --width 320 --height 180 --fps 12 --out output/interaction_demo.mp4
          aetherpaper snapshot examples/interaction_demo.json --at 3.0 --out output/prop_pickup.png
          aetherpaper snapshot examples/interaction_demo.json --at 6.0 --out output/prop_carry.png
          aetherpaper snapshot examples/interaction_demo.json --at 9.0 --out output/prop_placed.png
      - name: Render all three visual styles
        run: |
          aetherpaper render examples/visual_demo.json --width 320 --height 180 --fps 12 --out output/visual_demo.mp4
          aetherpaper snapshot examples/visual_demo.json --at 1.5 --out output/style_papercut.png
          aetherpaper snapshot examples/visual_demo.json --at 4.5 --out output/style_scrapbook.png
          aetherpaper snapshot examples/visual_demo.json --at 7.5 --out output/style_storybook.png
      - name: Render and audit 24-second narrated explainer
        run: |
          aetherpaper render examples/explainer_demo.json --voice espeak --width 320 --height 180 --fps 12 --out output/explainer_demo.mp4
          aetherpaper qa output/explainer_demo.mp4 --frames-dir output/qa > output/explainer_qa.json
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=noprint_wrappers=1 output/explainer_demo.mp4 | grep -q 'codec_name=aac'
      - name: Render physics demonstration
        run: |
          aetherpaper render examples/physics_demo.json --width 320 --height 180 --fps 12 --out output/physics_demo.mp4
          aetherpaper qa output/physics_demo.mp4 --frames-dir output/physics_qa > output/physics_qa.json
      - name: Probe MP4 stream
        run: |
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of default=noprint_wrappers=1 output/ci.mp4
          test -s output/ci.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate,nb_frames -of default=noprint_wrappers=1 output/rig_demo.mp4
          test -s output/rig_demo.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate,nb_frames -of default=noprint_wrappers=1 output/interaction_demo.mp4
          test -s output/interaction_demo.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate,nb_frames -of default=noprint_wrappers=1 output/visual_demo.mp4
          test -s output/visual_demo.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate,nb_frames -of default=noprint_wrappers=1 output/explainer_demo.mp4
          test -s output/explainer_demo.mp4
          test -s output/physics_demo.mp4
      - name: Upload reproducible rendered demonstrations
        uses: actions/upload-artifact@v4
        with:
          name: aetherpaper-v02-rig-render
          path: |
            output/rig_demo.mp4
            output/interaction_demo.mp4
            output/visual_demo.mp4
            output/explainer_demo.mp4
            output/physics_demo.mp4
            output/physics_qa.json
            output/physics_qa/
            output/explainer_qa.json
            output/qa/
            output-manifest.json
            output/style_papercut.png
            output/style_scrapbook.png
            output/style_storybook.png
            output/prop_pickup.png
            output/prop_carry.png
            output/prop_placed.png
            output/rig_run.png
            output/rig_gesture.png
            output/rig_speech.png
          retention-days: 30
